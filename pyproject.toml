[project]
name = "supermarketai"
version = "0.1.0"
description = "supermarketai using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[file-processing,litellm,tools]>=1.15.22,<2.0.0",
    "exa-py",
]

[project.scripts]
supermarketai = "supermarketai.main:run"
run_crew = "supermarketai.main:run"
train = "supermarketai.main:train"
replay = "supermarketai.main:replay"
test = "supermarketai.main:test"
run_with_trigger = "supermarketai.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "a518a126-8350-4464-a075-ab52b1bf5879"

[tool.uv]
override-dependencies = ["litellm<=1.82.6"]
